server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Todos los archivos de texto del proyecto estan guardados como UTF-8.
    # Declararlo en HTTP evita que clientes que no respetan el <meta charset>
    # interpreten las tildes con la pagina de codigos de Windows.
    charset utf-8;

    # Reverse proxy hacia el servicio `api` del compose.
    # El backend Node conserva sus rutas intactas.
    location /health {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;
    }

    # Archivos estáticos de la interfaz.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cabeceras de cache para assets estáticos.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
