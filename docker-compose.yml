name: globalhealth

services:
  postgres-master:
    image: postgres:16.4
    container_name: globalhealth-postgres-master
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Define POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: globalhealth
      APP_DB_USER: ${APP_DB_USER:-globalhealth_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD in .env}
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Define REPLICATION_PASSWORD in .env}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
    ports:
      # Puerto del host configurable para evitar conflicto con PostgreSQL local.
      - "${POSTGRES_MASTER_PORT:-55432}:5432"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./infra/postgres/master/init-primary.sh:/docker-entrypoint-initdb.d/10-init-primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalhealth"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      data_net:
        ipv4_address: 172.28.0.10

  postgres-replica:
    image: postgres:16.4
    container_name: globalhealth-postgres-replica
    restart: unless-stopped
    depends_on:
      postgres-master:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres-master
      PRIMARY_PORT: "5432"
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Define REPLICATION_PASSWORD in .env}
    entrypoint: ["/bin/bash", "/opt/globalhealth/replica-entrypoint.sh"]
    ports:
      - "${POSTGRES_REPLICA_PORT:-55433}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./infra/postgres/replica/replica-entrypoint.sh:/opt/globalhealth/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalhealth && psql -U postgres -d globalhealth -tAc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      data_net:
        ipv4_address: 172.28.0.11

  # MongoDB local para desarrollar la capa de telemetría. Atlas reemplazará
  # MONGO_URL en despliegue; las credenciales reales nunca se versionan.
  mongodb:
    image: mongo:7.0
    container_name: globalhealth-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: globalhealth_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - data_net

  # SQL Server conserva el XSD como XML SCHEMA COLLECTION y valida dentro del
  # motor cada asignación a la columna XML tipada.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    container_name: globalhealth-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      data_net:
        ipv4_address: 172.28.0.12

  # Trabajo de inicialización desechable: ejecuta los scripts T-SQL en orden y
  # termina. Los XML inválidos se envían a la columna tipada para que SQL Server
  # produzca y registre los errores exactos.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    container_name: globalhealth-sqlserver-init
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "/opt/globalhealth/init-xml.sh"]
    volumes:
      - ./infra/sqlserver/init-xml.sh:/opt/globalhealth/init-xml.sh:ro
      - ./xml/sqlserver:/scripts:ro
    networks:
      - data_net

  # Backend real con dos pools físicos. No existe fallback entre conexiones:
  # escritura apunta al master y dashboard a la réplica hot-standby.
  api:
    build:
      context: ./api
    container_name: globalhealth-api
    restart: unless-stopped
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_WRITE_URL: postgresql://${APP_DB_USER:-globalhealth_app}:${APP_DB_PASSWORD:?Define APP_DB_PASSWORD in .env}@postgres-master:5432/globalhealth
      DB_READ_URL: postgresql://${APP_DB_USER:-globalhealth_app}:${APP_DB_PASSWORD:?Define APP_DB_PASSWORD in .env}@postgres-replica:5432/globalhealth
      # Capa XML: conexión perezosa a SQL Server (solo la usan /api/expedientes*).
      MSSQL_URL: Server=sqlserver,1433;Database=GlobalHealthXml;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env};Encrypt=true;TrustServerCertificate=true;Connection Timeout=5
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      data_net:
        ipv4_address: 172.28.0.20

  # Interfaz gráfica (nginx) que sirve el panel y actúa como reverse proxy
  # hacia `api`. Reemplaza la prueba por consola (Invoke-RestMethod/curl).
  web:
    build:
      context: ./web
    container_name: globalhealth-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      data_net:
        ipv4_address: 172.28.0.30

networks:
  data_net:
    name: globalhealth_data_net
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_master_data:
  postgres_replica_data:
  mongo_data:
  sqlserver_data: